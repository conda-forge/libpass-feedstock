{% set name = "libpass" %}
{% set version = "1.9.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/libpass-{{ version }}.tar.gz
  sha256: 4ff9a5ebf51aad1e8164453bc29c4a06926cf175a9501d87205612ba247f3cbd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - passlib
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/notypecheck/passlib
  summary: Fork of passlib, a comprehensive password hashing framework supporting over 30 schemes
  license: BSD-4-Clause-UC
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nicoddemus
