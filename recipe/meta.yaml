{% set name = "libpass" %}
{% set version = "1.9.5.post0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/libpass-{{ version }}.tar.gz
  sha256: 7bf9897875443c782f4eb41903d98350619a25d42e96506c9763661a83607631

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - passlib
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/notypecheck/passlib
  summary: Fork of passlib, a comprehensive password hashing framework supporting over 30 schemes
  license: BSD-4-Clause-UC
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nicoddemus
